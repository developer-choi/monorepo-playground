name: Publish design system

on:
  push:
    branches: [master]
    paths: ['packages/design-system/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: publish-design-system

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: npm에 없는 버전인지 확인
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@developer-choi/design-system@$VERSION" version --registry=https://registry.npmjs.org/ | grep -q .; then
            echo "$VERSION은 이미 배포됐다. 건너뛴다."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION을 배포한다."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # trusted publishing은 npm 11.5.1 이상이 필요하다
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11.9.0

      - if: steps.version.outputs.publish == 'true'
        run: |
          corepack enable
          yarn install --immutable

      - if: steps.version.outputs.publish == 'true'
        run: npm publish --registry=https://registry.npmjs.org/
